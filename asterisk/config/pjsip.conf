;==============================================================================
; PJSIP configuration — Asterisk 22
;
;  Transports
;    transport-udp   5060/udp   classic SIP phones / softphones
;    transport-tcp   5060/tcp
;    transport-tls   5061/tcp   SIP over TLS
;    transport-wss   SIP over WebSocket (ws://:8088/ws, wss://:8089/ws), see http.conf
;
;  Users are generated from users.json at container start into
;  /var/lib/asterisk/generated/pjsip_users.conf (see bin/asterisk-gen-config).
;  The templates they use are defined below.
;==============================================================================

[global]
type = global
user_agent = Asterisk 22 PBX
endpoint_identifier_order = ip,username,anonymous,header,auth_username
default_realm = asterisk
keep_alive_interval = 30
max_initial_qualify_time = 5
ignore_uri_user_options = yes

[system]
type = system
; Never silently switch large UDP requests (video SDPs) to TCP.
disable_tcp_switch = yes

;------------------------------------------------------------------------------
; Transports
;------------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
tos = cs3
cos = 3
#tryinclude /var/lib/asterisk/generated/pjsip_transport_nat.conf

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
tos = cs3
cos = 3
#tryinclude /var/lib/asterisk/generated/pjsip_transport_nat.conf

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /var/lib/asterisk/keys/asterisk.crt
priv_key_file = /var/lib/asterisk/keys/asterisk.key
method = tlsv1_2
verify_client = no
verify_server = no
tos = cs3
cos = 3
#tryinclude /var/lib/asterisk/generated/pjsip_transport_nat.conf

; WebSocket transport. Bind/port are taken from http.conf; a single transport
; object serves both ws:// and wss:// connections.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

external_media_address=192.168.1.8
external_signaling_address=192.168.1.8
local_net=172.26.0.0/16
local_net=192.168.1.0/24

;------------------------------------------------------------------------------
; Templates
;------------------------------------------------------------------------------

; Settings shared by every user endpoint.
[endpoint-common](!)
type = endpoint
context = from-internal
subscribe_context = from-internal
language = en
tone_zone = us
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
send_pai = yes
trust_id_inbound = no
trust_id_outbound = yes
allow_transfer = yes
allow_subscribe = yes
timers = yes
moh_suggest = default
device_state_busy_at = 0
rtp_timeout = 120
rtp_timeout_hold = 3600

; Browser / WebRTC users (SIP.js, JsSIP, ... over WSS).
;   webrtc=yes implies: use_avpf, media_encryption=dtls, dtls_verify=fingerprint,
;   dtls_setup=actpass, ice_support, media_use_received_transport, rtcp_mux,
;   bundle and an ephemeral DTLS certificate.
; Video is relayed (never transcoded) so VP8 is listed first: every browser
; supports it, which keeps both legs of a call on the same video codec.
[webrtc-endpoint](!,endpoint-common)
webrtc = yes
; Browsers send RTP continuously (even when muted): hang up within 30 s when a
; tab is closed or crashes mid-call instead of leaving the other side waiting.
rtp_timeout = 30
disallow = all
allow = opus,g722,ulaw,alaw,vp8,h264
max_audio_streams = 1
max_video_streams = 1

; Hardware phones and desktop softphones (Linphone, Zoiper, MicroSIP, ...).
[sip-endpoint](!,endpoint-common)
disallow = all
allow = g722,ulaw,alaw,opus,h264,vp8
ice_support = no
media_encryption = no

[auth-userpass](!)
type = auth
auth_type = digest

; Browser contacts are not qualified: many WebRTC clients never answer OPTIONS,
; which would mark them Unavailable and make every call to them fail (480).
; Asterisk removes a browser's contact by itself when its WebSocket closes.
[aor-webrtc](!)
type = aor
max_contacts = 5
remove_existing = yes
remove_unavailable = yes
qualify_frequency = 0

[aor-sip](!)
type = aor
max_contacts = 3
remove_existing = yes
remove_unavailable = yes
qualify_frequency = 60
qualify_timeout = 5.0

;------------------------------------------------------------------------------
; Users (generated from users.json)
;------------------------------------------------------------------------------
#tryinclude /var/lib/asterisk/generated/pjsip_users.conf
