;==============================================================================
; Twilio Elastic SIP trunk + agent phones — migrated from the chan_sip sip.conf
;
; chan_sip was removed in Asterisk 21; this file is the PJSIP equivalent of:
;
;   sip.conf                          PJSIP
;   --------------------------------  ------------------------------------------
;   udpbindaddr=0.0.0.0:5061          transport-udp-5061 (Twilio Origination URI)
;   [twilio-trunk]                    endpoint + aor "twilio-trunk" (termination)
;   [twilio-gw1..gw1d]                identify "twilio-gw" (inbound, by source IP)
;   [test], [agent1..agent5]          endpoints in context "trusted"
;   allowguest=no                     no anonymous endpoint is defined
;   insecure=port,invite              matched by IP, no inbound authentication
;   nat=force_rport,comedia           force_rport + rtp_symmetric + rewrite_contact
;   directmedia=no                    direct_media = no
;   dtmfmode=rfc2833                  dtmf_mode = rfc4733 (same thing, new name)
;   qualify=yes                       qualify_frequency = 60
;   fromdomain=165.227.41.222         from_domain = 165.227.41.222
;
; Not carried over: the unused templates (basic-options, natted-phone,
; public-phone, my-codecs, ulaw-phone) and tcpenable=no (the TCP/TLS
; transports in pjsip.conf are still used by the other SIP phones).
;
; Included from pjsip.conf, after the templates it reuses.
;==============================================================================

;------------------------------------------------------------------------------
; UDP 5061 — Twilio sends origination traffic here (and the agents register
; here, as they did with chan_sip). 5061/tcp remains SIP over TLS.
;------------------------------------------------------------------------------
[transport-udp-5061]
type = transport
protocol = udp
bind = 0.0.0.0:5061
tos = cs3
cos = 3
#tryinclude /var/lib/asterisk/generated/pjsip_transport_nat.conf

;------------------------------------------------------------------------------
; Twilio trunk
;------------------------------------------------------------------------------
[twilio-trunk]
type = endpoint
transport = transport-udp-5061
context = from-twilio
aors = twilio-trunk
from_domain = 165.227.41.222
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
language = en
tone_zone = us

; Termination (outbound): Dial(PJSIP/+15551234567@twilio-trunk)
[twilio-trunk]
type = aor
contact = sip:sdm-staging.pstn.twilio.com:5060
qualify_frequency = 60
qualify_timeout = 5.0

; Origination (inbound): Twilio does not authenticate to us, so calls are
; accepted from Twilio's signalling addresses only. 54.172.60.0-3 is the
; US East (Virginia) edge; add the other edges' ranges if the trunk uses them.
[twilio-gw]
type = identify
endpoint = twilio-trunk
match = 54.172.60.0
match = 54.172.60.1
match = 54.172.60.2
match = 54.172.60.3

;------------------------------------------------------------------------------
; Agent phones (classic SIP, G.711 only, context "trusted")
;------------------------------------------------------------------------------
[agent-endpoint](!,endpoint-common)
context = trusted
subscribe_context = trusted
disallow = all
allow = ulaw,alaw
ice_support = no
media_encryption = no

; SECURITY: these are the passwords from the original sip.conf. "trusted" can
; dial the PSTN through Twilio, so change them before exposing 5060/5061.

[test](agent-endpoint)
auth = test
aors = test
[test](auth-userpass)
username = test
password = test
[test](aor-sip)

[agent1](agent-endpoint)
auth = agent1
aors = agent1
[agent1](auth-userpass)
username = agent1
password = agent1
[agent1](aor-sip)

[agent2](agent-endpoint)
auth = agent2
aors = agent2
[agent2](auth-userpass)
username = agent2
password = agent2
[agent2](aor-sip)

[agent3](agent-endpoint)
auth = agent3
aors = agent3
[agent3](auth-userpass)
username = agent3
password = agent3
[agent3](aor-sip)

[agent4](agent-endpoint)
auth = agent4
aors = agent4
[agent4](auth-userpass)
username = agent4
password = agent4
[agent4](aor-sip)

[agent5](agent-endpoint)
auth = agent5
aors = agent5
[agent5](auth-userpass)
username = agent5
password = agent5
[agent5](aor-sip)
