;==============================================================================
; Dialplan — Asterisk 22
;
;   1XXX/2XXX ...  user extensions (generated from users.json)
;   600            echo test (audio + video are reflected back to you)
;   601            hello world / playback test
;   602            music on hold
;   603            DTMF test (reads back the digits you press)
;   700            video conference room (ConfBridge, video follows the talker)
;   test, agent1-5 agent phones (pjsip_twilio.conf)
;
;   from-twilio    inbound PSTN calls from the Twilio trunk -> ring the agents
;   trusted        agent phones: users, agents, services + PSTN via Twilio
;==============================================================================

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
RING_TIMEOUT = 45
; Devices rung for inbound Twilio calls (Dial syntax, & separated).
TWILIO_RING_GROUP = PJSIP/agent1&PJSIP/agent2&PJSIP/agent3&PJSIP/agent4&PJSIP/agent5
; Caller ID (E.164) for outbound PSTN calls: a Twilio number or verified ID.
; Empty = pass the caller's own number through.
TWILIO_CALLERID =

;------------------------------------------------------------------------------
; Entry point for every user endpoint (pjsip.conf: context = from-internal)
;------------------------------------------------------------------------------
[from-internal]
include => users
include => agents
include => services
include => unallocated

;------------------------------------------------------------------------------
; Entry point for the agent phones (pjsip_twilio.conf: context = trusted).
; Same as from-internal, plus outbound PSTN calls through Twilio.
;------------------------------------------------------------------------------
[trusted]
include => users
include => agents
include => services
include => twilio-outbound
include => unallocated

;------------------------------------------------------------------------------
; Inbound calls from the Twilio trunk (pjsip_twilio.conf: context = from-twilio).
; Untrusted: must never reach twilio-outbound.
;------------------------------------------------------------------------------
[from-twilio]
exten => _[+0-9].,1,Set(__TWILIO_DID=${EXTEN})
 same => n,Goto(twilio-inbound,s,1)
exten => s,1,Goto(twilio-inbound,s,1)

[twilio-inbound]
exten => s,1,NoOp(Twilio call to ${TWILIO_DID} from ${CALLERID(all)})
 same => n,Dial(${TWILIO_RING_GROUP},${RING_TIMEOUT},t)
 same => n,Goto(sub-dial-user,s-${DIALSTATUS},1)

;------------------------------------------------------------------------------
; Agent phones + device-state hints
;------------------------------------------------------------------------------
[agents]
exten => test,hint,PJSIP/test
exten => test,1,Gosub(sub-dial-user,s,1(test))
 same => n,Hangup()
exten => agent1,hint,PJSIP/agent1
exten => agent1,1,Gosub(sub-dial-user,s,1(agent1))
 same => n,Hangup()
exten => agent2,hint,PJSIP/agent2
exten => agent2,1,Gosub(sub-dial-user,s,1(agent2))
 same => n,Hangup()
exten => agent3,hint,PJSIP/agent3
exten => agent3,1,Gosub(sub-dial-user,s,1(agent3))
 same => n,Hangup()
exten => agent4,hint,PJSIP/agent4
exten => agent4,1,Gosub(sub-dial-user,s,1(agent4))
 same => n,Hangup()
exten => agent5,hint,PJSIP/agent5
exten => agent5,1,Gosub(sub-dial-user,s,1(agent5))
 same => n,Hangup()

;------------------------------------------------------------------------------
; Outbound PSTN through Twilio (only reachable from "trusted"). Numbers are
; normalised to E.164, which is what Twilio termination expects.
;------------------------------------------------------------------------------
[twilio-outbound]
exten => _+X.,1,Gosub(sub-dial-twilio,s,1(${EXTEN}))
 same => n,Hangup()
exten => _011X.,1,Gosub(sub-dial-twilio,s,1(+${EXTEN:3}))
 same => n,Hangup()
exten => _1NXXNXXXXXX,1,Gosub(sub-dial-twilio,s,1(+${EXTEN}))
 same => n,Hangup()
exten => _NXXNXXXXXX,1,Gosub(sub-dial-twilio,s,1(+1${EXTEN}))
 same => n,Hangup()

;------------------------------------------------------------------------------
; User extensions + device-state hints (for presence / BLF)
;------------------------------------------------------------------------------
[users]
#tryinclude /var/lib/asterisk/generated/extensions_users.conf

;------------------------------------------------------------------------------
; Built-in test services
;------------------------------------------------------------------------------
[services]
exten => 600,1,NoOp(Echo test for ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(0.3)
 same => n,SayUnixTime(,,IMp)
 same => n,Wait(1)
 same => n,Hangup()

exten => 602,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,MusicOnHold(default,300)
 same => n,Hangup()

exten => 603,1,NoOp(DTMF test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n(again),Read(DIGITS,beep,8,,1,10)
 same => n,GotoIf($["${DIGITS}" = ""]?done)
 same => n,SayDigits(${DIGITS})
 same => n,Goto(again)
 same => n(done),Playback(vm-goodbye)
 same => n,Hangup()

exten => 700,1,NoOp(Conference room ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},video_bridge,video_user)
 same => n,Hangup()

;------------------------------------------------------------------------------
; Anything else: "unallocated number" (SIP 404)
;------------------------------------------------------------------------------
[unallocated]
exten => _[0-9*#+]!,1,NoOp(Unallocated number ${EXTEN})
 same => n,Hangup(1)

;------------------------------------------------------------------------------
; Gosub(sub-dial-user,s,1(<extension>))
; Rings every registered device of a user and maps the outcome to a precise
; SIP response for the caller (486 busy, 480 unavailable / no answer, ...).
;------------------------------------------------------------------------------
[sub-dial-user]
exten => s,1,NoOp(Dialing user ${ARG1})
 same => n,Set(DEVICES=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($["${DEVICES}" = ""]?offline)
 same => n,Dial(${DEVICES},${RING_TIMEOUT},Tt)
 same => n,Goto(s-${DIALSTATUS},1)
 same => n(offline),NoOp(${ARG1} has no registered devices)
 same => n,Hangup(20)

exten => s-BUSY,1,Hangup(17)
exten => s-NOANSWER,1,Hangup(19)
exten => s-CHANUNAVAIL,1,Hangup(20)
exten => s-CONGESTION,1,Hangup(34)
exten => _s-.,1,Hangup(16)

;------------------------------------------------------------------------------
; Gosub(sub-dial-twilio,s,1(<E.164 number>))
;------------------------------------------------------------------------------
[sub-dial-twilio]
exten => s,1,NoOp(Outbound call to ${ARG1} via Twilio)
 same => n,ExecIf($["${TWILIO_CALLERID}" != ""]?Set(CALLERID(num)=${TWILIO_CALLERID}))
 same => n,Dial(PJSIP/${ARG1}@twilio-trunk,90)
 same => n,Goto(sub-dial-user,s-${DIALSTATUS},1)
