;==============================================================================
; Dialplan — Asterisk 22
;
;   1XXX/2XXX ...  user extensions (generated from users.json)
;   600            echo test (audio + video are reflected back to you)
;   601            hello world / playback test
;   602            music on hold
;   603            DTMF test (reads back the digits you press)
;   700            video conference room (ConfBridge, video follows the talker)
;==============================================================================

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
RING_TIMEOUT = 45

;------------------------------------------------------------------------------
; Entry point for every user endpoint (pjsip.conf: context = from-internal)
;------------------------------------------------------------------------------
[from-internal]
include => users
include => services
include => unallocated

;------------------------------------------------------------------------------
; User extensions + device-state hints (for presence / BLF)
;------------------------------------------------------------------------------
[users]
#tryinclude /var/lib/asterisk/generated/extensions_users.conf

;------------------------------------------------------------------------------
; Built-in test services
;------------------------------------------------------------------------------
[services]
exten => 600,1,NoOp(Echo test for ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(0.3)
 same => n,SayUnixTime(,,IMp)
 same => n,Wait(1)
 same => n,Hangup()

exten => 602,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,MusicOnHold(default,300)
 same => n,Hangup()

exten => 603,1,NoOp(DTMF test)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n(again),Read(DIGITS,beep,8,,1,10)
 same => n,GotoIf($["${DIGITS}" = ""]?done)
 same => n,SayDigits(${DIGITS})
 same => n,Goto(again)
 same => n(done),Playback(vm-goodbye)
 same => n,Hangup()

exten => 700,1,NoOp(Conference room ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},video_bridge,video_user)
 same => n,Hangup()

;------------------------------------------------------------------------------
; Anything else: "unallocated number" (SIP 404)
;------------------------------------------------------------------------------
[unallocated]
exten => _[0-9*#+]!,1,NoOp(Unallocated number ${EXTEN})
 same => n,Hangup(1)

;------------------------------------------------------------------------------
; Gosub(sub-dial-user,s,1(<extension>))
; Rings every registered device of a user and maps the outcome to a precise
; SIP response for the caller (486 busy, 480 unavailable / no answer, ...).
;------------------------------------------------------------------------------
[sub-dial-user]
exten => s,1,NoOp(Dialing user ${ARG1})
 same => n,Set(DEVICES=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($["${DEVICES}" = ""]?offline)
 same => n,Dial(${DEVICES},${RING_TIMEOUT},Tt)
 same => n,Goto(s-${DIALSTATUS},1)
 same => n(offline),NoOp(${ARG1} has no registered devices)
 same => n,Hangup(20)

exten => s-BUSY,1,Hangup(17)
exten => s-NOANSWER,1,Hangup(19)
exten => s-CHANUNAVAIL,1,Hangup(20)
exten => s-CONGESTION,1,Hangup(34)
exten => _s-.,1,Hangup(16)
