; Conference bridges (extension 700)
[general]

[video_bridge]
type = bridge
max_members = 25
mixing_interval = 20
internal_sample_rate = auto
; Everyone sees the active talker. Works with any single-stream SIP/WebRTC client.
video_mode = follow_talker
language = en

[video_user]
type = user
music_on_hold_when_empty = yes
music_on_hold_class = default
announce_user_count = yes
announce_only_user = yes
dsp_drop_silence = yes
dtmf_passthrough = no
talk_detection_events = yes
