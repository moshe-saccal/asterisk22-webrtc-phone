; Logging — console output goes to the container log (docker compose logs asterisk),
; files are kept in the asterisk-logs volume.
[general]
dateformat = %F %T.%3q
use_callids = yes
appendhostname = no
queue_log = no

[logfiles]
console      => notice,warning,error,verbose(3)
messages.log => notice,warning,error,verbose
security.log => security
