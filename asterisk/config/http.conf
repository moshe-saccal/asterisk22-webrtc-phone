; Built-in HTTP server — carries the SIP-over-WebSocket transport (RFC 7118).
;   ws://<host>:8088/ws   (plain; only reachable inside the compose network)
;   wss://<host>:8089/ws  (TLS)
[general]
servername = Asterisk
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /var/lib/asterisk/keys/asterisk.crt
tlsprivatekey = /var/lib/asterisk/keys/asterisk.key
enablestatic = no
