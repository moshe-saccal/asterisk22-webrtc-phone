name: asterisk22

services:
  asterisk:
    build:
      context: ./asterisk
    image: asterisk22-webrtc:22.11.0
    # Asterisk puts its hostname in the From/Contact of every request it sends.
    # Docker's default (the random container ID) can start with a digit, which is
    # not a valid SIP host: JsSIP-based clients then silently drop incoming calls.
    hostname: asterisk22.duckdns.org
    restart: unless-stopped
    environment:
      EXTERNAL_IP: 165.227.41.222
      RTP_PORT_START: 10000
      RTP_PORT_END: 10099
      STUN_SERVER: stun:stun.l.google.com:19302
      TURN_SERVER: 
      TURN_USERNAME: 
      TURN_PASSWORD: 
    ports:
      - "5060:5060/udp"                  # SIP
      - "5060:5060/tcp"                  # SIP
      - "5061:5061/tcp"                  # SIP over TLS
      - "5061:5061/udp"                  # SIP (Twilio trunk + agent phones)
      - "8089:8089/tcp"                  # SIP over secure WebSocket (direct)
      - "127.0.0.1:8088:8088/tcp"        # SIP over WebSocket (local dev only)
      - "${RTP_PORT_START:-10000}-${RTP_PORT_END:-10099}:${RTP_PORT_START:-10000}-${RTP_PORT_END:-10099}/udp"
    volumes:
      - /data/etc:/etc/asterisk:ro
      - /data/recordings:/var/spool/asterisk/recordings
      - /data/audios:/var/lib/asterisk/sounds/:ro
    ulimits:
      nofile: 65536

